<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b2a3a" />
    <title>Bells Beach — Surf Sim</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b2a3a;
        overscroll-behavior: none;
        touch-action: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(180deg, #0e3448 0%, #0b2a3a 100%);
        color: #cfe8f3;
        z-index: 20;
        transition: opacity 0.6s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #loading p {
        font-size: 12px;
        opacity: 0.7;
      }
      #loading .bar {
        width: min(220px, 60vw);
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #loading .bar i {
        display: block;
        height: 100%;
        width: 0%;
        background: #7fd4f0;
        transition: width 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <h1>Bells Beach</h1>
      <div class="bar"><i id="loading-bar"></i></div>
      <p id="loading-msg">Paddling out…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
